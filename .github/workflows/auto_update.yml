name: Auto Update Shadowrocket Rules

on:
  schedule:
    - cron: '20 20 * * *' # 每日北京时间凌晨 04:20 (UTC 20:20) 运行一次
  workflow_dispatch:      # 允许在 GitHub 页面上手动点击触发
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '*.sgmodule'
      - '*.conf'

permissions:
  contents: write         # 允许写入仓库

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Script to Generate Rules
        run: |
          if [ -f generate_ai.py ]; then
            python generate_ai.py
          fi
          if [ -f generate_talkatone.py ]; then
            python generate_talkatone.py
          fi
          if [ -f scratch/generate_custom_adblock.py ]; then
            python scratch/generate_custom_adblock.py
          elif [ -f generate_custom_adblock.py ]; then
            python generate_custom_adblock.py
          fi
          if [ -f generate_custome_conf.py ]; then
            python generate_custome_conf.py
          fi

      - name: Check and Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.sgmodule *.conf
          # 使用 --allow-empty 确保即使上游源规则未变，云端抓取构建后也能 100% 刷新产生最新 Commit
          git commit --allow-empty -m "Auto-update Shadowrocket proxy/adblock rules [skip ci]"
          git push
